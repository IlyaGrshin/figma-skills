<!doctype html>
<html>
<head>
  <style>
    html, body { margin: 0; padding: 0; height: auto; min-height: 0; }
    body { display: block; font-family: var(--font-family); }
    #plugin-root { height: auto; }
    body > #plugin-root > fig-footer {
      background-color: var(--figma-color-bg);
      box-shadow: inset 0 1px 0 0 var(--figma-color-border);
      border-radius: 0 0 var(--radius-large) var(--radius-large);
    }
    .muted { color: var(--figma-color-text-secondary); font-size: 11px; }
    #summary { font-size: 11px; line-height: 16px; color: var(--figma-color-text); }
    #summary b { font-weight: 600; }
    #console {
      font-family: var(--font-family-mono, ui-monospace, monospace);
      font-size: 10px; line-height: 14px;
      background: var(--figma-color-bg-secondary);
      border: 1px solid var(--figma-color-border);
      border-radius: var(--radius-medium, 4px);
      padding: 6px 8px; max-height: 120px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    #console .warn { color: var(--figma-color-text-warning); }
    #console .error { color: var(--figma-color-text-danger); }
    #items { max-height: 180px; overflow-y: auto; font-size: 11px; }
    #items .row { padding: 4px 6px; border-radius: 4px; cursor: pointer; display: block; }
    #items .row:hover { background: var(--figma-color-bg-hover); }
    #items .reason { color: var(--figma-color-text-secondary); display: block; font-size: 10px; }
    #items .failed .title { color: var(--figma-color-text-danger); }
    /* custom blocks get the same side padding as PropsKit fields */
    .block { padding: 0 16px; margin: 4px 0 8px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .section-title { font-size: 11px; font-weight: 600; }
    #console { min-height: 44px; }
    .hidden { display: none !important; }
    fig-footer .buttons { display: flex; gap: 8px; justify-content: flex-end; width: 100%; }
  </style>
</head>
<body>
  <div id="plugin-root">
    <fig-content>
      <fig-field>
        <label>Компонент</label>
        <!-- keep in sync with RECIPES in code.ts -->
        <fig-dropdown id="recipe">
          <option value="deprecated-list-item" selected>(Deprecated) List Item → List Item (iOS)</option>
        </fig-dropdown>
      </fig-field>
      <fig-field>
        <label>Область</label>
        <fig-dropdown id="scope">
          <option value="selection">Выделенные экраны</option>
          <option value="page" selected>Текущая страница</option>
          <option value="file">Весь файл</option>
        </fig-dropdown>
      </fig-field>
      <div class="block">
        <div id="selinfo" class="muted">Страница</div>
        <div id="status" class="muted">Сначала нажмите «Проверить»</div>
      </div>

      <div id="summary" class="block hidden"></div>
      <div id="itemsWrap" class="block hidden">
        <div class="section-head"><span class="section-title">Не заменено — клик ведёт к слою</span></div>
        <div id="items"></div>
      </div>

      <div class="block">
        <div class="section-head">
          <span class="section-title">Консоль</span>
          <fig-button id="copy" variant="secondary" disabled>Скопировать отчёт</fig-button>
        </div>
        <div id="console"></div>
      </div>
    </fig-content>
    <fig-footer sticky>
      <div class="buttons">
        <fig-button id="dry" variant="secondary">Проверить</fig-button>
        <fig-button id="apply" type="submit" disabled>Заменить</fig-button>
      </div>
    </fig-footer>
    <textarea id="clip" style="position:absolute;left:-9999px;top:0;height:1px;width:1px"></textarea>
  </div>

  <script>
  // Own scope: PropsKit (fig.js) already defines globals such as `$`.
  (() => {
    function post(message) { parent.postMessage({ pluginMessage: message }, '*') }
    const $ = (id) => document.getElementById(id)
    const SCOPE_LABEL = { selection: 'выделение', page: 'страница', file: 'весь файл' }

    let lastReport = null
    let checkedKey = null // recipe|scope that passed a dry run; Apply needs it
    let selection = { count: 0, page: '' }
    let busy = false
    let inited = false

    const current = () => ({ recipe: $('recipe').value || 'deprecated-list-item', scope: $('scope').value || 'page' })
    const keyOf = (c) => c.recipe + '|' + c.scope

    function log(text, level) {
      const line = document.createElement('div')
      if (level) line.className = level
      line.textContent = new Date().toLocaleTimeString() + '  ' + text
      $('console').appendChild(line)
      $('console').scrollTop = $('console').scrollHeight
    }

    function refresh() {
      const c = current()
      $('selinfo').textContent = c.scope === 'selection'
        ? (selection.count ? 'Выделено слоёв: ' + selection.count + ' · страница «' + selection.page + '»' : 'Выделите экраны или секции')
        : c.scope === 'page' ? 'Страница «' + selection.page + '»' : 'Все страницы файла'
      const needSel = c.scope === 'selection' && !selection.count
      setDisabled('dry', busy || needSel)
      setDisabled('apply', busy || needSel || checkedKey !== keyOf(c))
      setDisabled('copy', busy || !lastReport)
    }
    function setDisabled(id, v) { if (v) $(id).setAttribute('disabled', '') ; else $(id).removeAttribute('disabled') }

    function run(mode) {
      if (busy) return
      const c = current()
      busy = true
      $('status').textContent = mode === 'apply' ? 'Заменяю…' : 'Проверяю…'
      log((mode === 'apply' ? 'Замена' : 'Проверка') + ' запущена · ' + SCOPE_LABEL[c.scope])
      refresh()
      post({ type: 'run', mode, scope: c.scope, recipe: c.recipe })
    }

    function render(report) {
      const t = report.totals
      // Names come from the document (component sets, notes): text only, never HTML.
      const box = $('summary')
      box.textContent = ''
      const line = (text, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text; box.appendChild(d) }
      const head = document.createElement('div')
      const strong = document.createElement('b')
      if (report.mode === 'apply') { strong.textContent = 'Заменено: ' + t.migrated; head.append(strong, ' из ' + t.found + ' · пропущено ' + t.skipped + ' · откатов ' + t.failed) }
      else { strong.textContent = 'Можно заменить: ' + t.wouldMigrate; head.append(strong, ' из ' + t.found + ' · пропуск ' + t.skipped + ' · ошибок ' + t.failed) }
      box.appendChild(head)
      const locked = Object.entries(report.lockedIn)
      if (locked.length) line('Внутри библиотечных компонентов (исправлять в библиотеке): ' + locked.map(([k, v]) => k + ' ' + v).join(', '))
      const notes = Object.entries(report.notes)
      if (notes.length) line('Заметки: ' + notes.map(([k, v]) => k + ' ×' + v).join(', '))
      if (report.otherLibrary) line('Одноимённые компоненты другой библиотеки (не тронуты): ' + report.otherLibrary)
      line(report.seconds + ' с · ' + SCOPE_LABEL[report.scope] + ' · v' + report.version, 'muted')
      box.classList.remove('hidden')

      const bad = report.items.filter(i => i.result !== 'migrated')
      $('items').textContent = ''
      for (const i of bad.slice(0, 300)) {
        const row = document.createElement('span')
        row.className = 'row ' + i.result
        const title = document.createElement('span')
        title.className = 'title'
        title.textContent = (i.result === 'failed' ? '⚠ ' : '') + (i.screen || i.page) + (i.texts ? ' — ' + i.texts : '')
        const reason = document.createElement('span')
        reason.className = 'reason'
        reason.textContent = i.reason
        row.appendChild(title); row.appendChild(reason)
        row.addEventListener('click', () => post({ type: 'focus', id: i.id }))
        $('items').appendChild(row)
      }
      $('itemsWrap').classList.toggle('hidden', !bad.length)
    }

    function copyReport() {
      if (!lastReport) return
      const text = 'Migrate component report\n' + JSON.stringify(lastReport, null, 1)
      const done = () => { log('Отчёт скопирован — вставьте его в чат с Claude'); post({ type: 'notify', text: 'Отчёт скопирован' }) }
      const fallback = () => {
        const ta = $('clip')
        ta.value = text; ta.focus(); ta.select()
        try { document.execCommand('copy') ? done() : log('Не удалось скопировать. Отчёт также сохранён в файле — Claude прочитает его сам.', 'warn') }
        catch (e) { log('Не удалось скопировать: ' + e.message, 'warn') }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback)
      else fallback()
    }

    $('dry').addEventListener('click', () => run('dry'))
    $('apply').addEventListener('click', () => run('apply'))
    $('copy').addEventListener('click', copyReport)
    $('scope').addEventListener('change', refresh)
    $('recipe').addEventListener('change', refresh)

    window.onmessage = (event) => {
      const msg = event.data && event.data.pluginMessage
      if (!msg) return
      if (msg.type === 'init') {
        if (!inited) { inited = true; log('Migrate component v' + msg.version + ' готов') }
        refresh()
      } else if (msg.type === 'selection') {
        selection = msg; refresh()
      } else if (msg.type === 'log') {
        log(msg.text, msg.level === 'info' ? '' : msg.level)
      } else if (msg.type === 'progress') {
        $('status').textContent = msg.text
      } else if (msg.type === 'done') {
        busy = false
        if (msg.report) {
          lastReport = msg.report
          render(msg.report)
          const c = { recipe: msg.report.recipe, scope: msg.report.scope }
          // After a dry run the same scope can be applied; after apply, check again.
          checkedKey = msg.report.mode === 'dry' && !msg.report.error ? keyOf(c) : null
          $('status').textContent = msg.report.mode === 'dry' ? 'Проверено — можно заменять' : 'Готово. Отчёт сохранён в файле'
        } else $('status').textContent = 'Сначала нажмите «Проверить»'
        refresh()
      }
    }

    // UI errors would otherwise be invisible to the user.
    window.addEventListener('error', (e) => log('Ошибка интерфейса: ' + e.message, 'error'))

    // The sandbox may post before this iframe listens; ask for state once ready.
    post({ type: 'ready' })
    setTimeout(() => { if (!inited) log('Плагин не отвечает — закройте и откройте его заново', 'error') }, 4000)

    let lastHeight = 0, raf = 0
    function reportHeight() {
      const h = Math.ceil($('plugin-root').getBoundingClientRect().height)
      if (h && h !== lastHeight) { lastHeight = h; post({ type: 'resize', height: h }) }
    }
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(reportHeight) }).observe($('plugin-root'))
    }
  })()
  </script>
</body>
</html>
